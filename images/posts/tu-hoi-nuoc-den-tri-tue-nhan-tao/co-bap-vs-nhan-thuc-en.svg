<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e1a14" />
      <stop offset="100%" stop-color="#0c0b09" />
    </radialGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241f17" />
      <stop offset="100%" stop-color="#14120e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg-glow)" />

  <g stroke="#ffffff" stroke-width="1" opacity="0.03">
    <path d="M0 150 H1600 M0 300 H1600 M0 450 H1600 M0 600 H1600 M0 750 H1600" />
    <path d="M200 0 V900 M400 0 V900 M600 0 V900 M800 0 V900 M1000 0 V900 M1200 0 V900 M1400 0 V900" />
  </g>

  <!-- Header -->
  <text x="80" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#fae7b2" letter-spacing="1">Three Layers of Leverage: Muscle, Calculation &amp; Cognition</text>
  <text x="80" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#8e826b">How Human Civilizational Tools Shifted from Thermodynamic Force to Semantic Autonomy</text>

  <!-- 3 Big Pillar Cards -->

  <!-- Pillar 1: Muscle Liberation -->
  <g transform="translate(80, 160)" filter="url(#shadow)">
    <rect width="450" height="660" rx="14" fill="url(#card-grad)" stroke="#3d3527" stroke-width="1.5" />
    <rect x="24" y="24" width="90" height="26" rx="6" fill="#e8a317" fill-opacity="0.15" />
    <text x="69" y="42" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#e8a317" text-anchor="middle">LAYER 01</text>

    <text x="24" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#fae7b2">Muscle Liberation</text>
    <text x="24" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#a39680">Physical &amp; Kinetic Thermodynamic Force</text>

    <!-- Key Metrics Box -->
    <rect x="20" y="145" width="410" height="110" rx="8" fill="#110f0c" stroke="#2d271d" />
    <text x="35" y="175" font-family="ui-monospace, monospace" font-size="11" fill="#8e826b">TARGET DOMAIN</text>
    <text x="35" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#ffd56b">Biological Physical Exhaustion</text>
    <text x="35" y="235" font-family="ui-monospace, monospace" font-size="12" fill="#4ade80">Force Multiplier: ~1,000x human muscle</text>

    <text x="24" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#c7b99f">Core Technologies:</text>
    <text x="24" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#a39680">● Watt Steam Engine, coal boilers</text>
    <text x="24" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#a39680">● Internal combustion engines, petroleum</text>
    <text x="24" y="369" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#a39680">● Hydraulic cranes, industrial manufacturing</text>

    <text x="24" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#c7b99f">What Changed for Society:</text>
    <text x="24" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#a39680">Frees human beings from the physical tyranny</text>
    <text x="24" y="474" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#a39680">of manual hauling, plowing, and mining.</text>
    <text x="24" y="505" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#e8a317">Work becomes kinetic rather than biological.</text>

    <!-- Constraint tag -->
    <rect x="20" y="555" width="410" height="75" rx="8" fill="#171410" stroke="#3d3527" />
    <text x="35" y="583" font-family="ui-monospace, monospace" font-size="11" fill="#8e826b">CEILING / LIMITATION</text>
    <text x="35" y="608" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#f43f5e">Thermodynamic boundaries &amp; material wear-and-tear.</text>
  </g>

  <!-- Pillar 2: Calculation Automation -->
  <g transform="translate(575, 160)" filter="url(#shadow)">
    <rect width="450" height="660" rx="14" fill="url(#card-grad)" stroke="#22d3ee" stroke-width="1.5" />
    <rect x="24" y="24" width="90" height="26" rx="6" fill="#22d3ee" fill-opacity="0.15" />
    <text x="69" y="42" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#22d3ee" text-anchor="middle">LAYER 02</text>

    <text x="24" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#67e8f9">Calculation Automation</text>
    <text x="24" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#a39680">Deterministic Silicon Logic &amp; Bits</text>

    <!-- Key Metrics Box -->
    <rect x="20" y="145" width="410" height="110" rx="8" fill="#110f0c" stroke="#2d271d" />
    <text x="35" y="175" font-family="ui-monospace, monospace" font-size="11" fill="#8e826b">TARGET DOMAIN</text>
    <text x="35" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#67e8f9">Repetitive Arithmetic &amp; Bookkeeping</text>
    <text x="35" y="235" font-family="ui-monospace, monospace" font-size="12" fill="#4ade80">Speed Multiplier: &gt; 1,000,000,000x arithmetic</text>

    <text x="24" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#c7b99f">Core Technologies:</text>
    <text x="24" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#a39680">● Von Neumann CPU, semiconductors</text>
    <text x="24" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#a39680">● Relational databases (SQL), spreadsheets</text>
    <text x="24" y="369" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#a39680">● Global fiber optics, internet routing</text>

    <text x="24" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#c7b99f">What Changed for Society:</text>
    <text x="24" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#a39680">Frees human beings from rote ledger checks,</text>
    <text x="24" y="474" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#a39680">tax computations, and manual data indexing.</text>
    <text x="24" y="505" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#22d3ee">Software replication marginal cost reaches zero.</text>

    <!-- Constraint tag -->
    <rect x="20" y="555" width="410" height="75" rx="8" fill="#171410" stroke="#3d3527" />
    <text x="35" y="583" font-family="ui-monospace, monospace" font-size="11" fill="#8e826b">CEILING / LIMITATION</text>
    <text x="35" y="608" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#f43f5e">Rigid determinism; completely brittle to ambiguity or uncurated text.</text>
  </g>

  <!-- Pillar 3: Cognitive Synthesis -->
  <g transform="translate(1070, 160)" filter="url(#shadow)">
    <rect width="450" height="660" rx="14" fill="url(#card-grad)" stroke="#d4af37" stroke-width="2" />
    <rect x="24" y="24" width="90" height="26" rx="6" fill="#e8a317" fill-opacity="0.2" />
    <text x="69" y="42" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#ffd56b" text-anchor="middle">LAYER 03</text>

    <text x="24" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#ffd56b">Cognitive Synthesis</text>
    <text x="24" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#a39680">Neural Reasoning &amp; Semantic Discretion</text>

    <!-- Key Metrics Box -->
    <rect x="20" y="145" width="410" height="110" rx="8" fill="#110f0c" stroke="#2d271d" />
    <text x="35" y="175" font-family="ui-monospace, monospace" font-size="11" fill="#8e826b">TARGET DOMAIN</text>
    <text x="35" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#ffd56b">Semantic Ambiguity &amp; Decision Discretion</text>
    <text x="35" y="235" font-family="ui-monospace, monospace" font-size="12" fill="#4ade80">Scope: Synthesis of complex natural contexts</text>

    <text x="24" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#c7b99f">Core Technologies:</text>
    <text x="24" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#a39680">● Foundation LLMs, multimodal transformers</text>
    <text x="24" y="342" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#a39680">● System One calibrated decision heads (Jev, CLM)</text>
    <text x="24" y="369" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#a39680">● Autonomous closed-loop agents</text>

    <text x="24" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#c7b99f">What Changed for Society:</text>
    <text x="24" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#a39680">Automates judgment, synthesis, coding, and</text>
    <text x="24" y="474" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#a39680">orchestration over noisy, unstructured data.</text>
    <text x="24" y="505" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#ffd56b">Marginal cost of cognition approaches energy floor.</text>

    <!-- Frontier note -->
    <rect x="20" y="555" width="410" height="75" rx="8" fill="#171410" stroke="#d4af37" stroke-width="1.2" />
    <text x="35" y="583" font-family="ui-monospace, monospace" font-size="11" fill="#ffd56b">THE NEW PARADIGM</text>
    <text x="35" y="608" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#4ade80">Ambient intelligence embedded permanently inside software infrastructure.</text>
  </g>
</svg>
