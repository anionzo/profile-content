  <g transform="translate(80, 450)" filter="url(#shadow)">
    <rect width="440" height="200" rx="12" fill="url(#card-grad)" stroke="#3d3527" stroke-width="1.5" />
    <rect x="20" y="20" width="80" height="24" rx="4" fill="#e8a317" fill-opacity="0.15" />
    <text x="60" y="36" font-family="ui-monospace, monospace" font-size="11" font-weight="700" fill="#e8a317" text-anchor="middle">STAGE 6</text>
    
    <text x="20" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#fff">Human Review &amp; Deployment</text>
    <text x="20" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8e826b">Engineers review summarized diffs before live push</text>

    <rect x="20" y="120" width="400" height="60" rx="6" fill="#110f0c" stroke="#2d271d" />
    <text x="35" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#ffd56b">Audit trail sealed with cryptographic signature</text>
    <text x="35" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8e826b">Production canary rollout initiated automatically</text>
  </g>

  <!-- Bottom Banner: Sandbox Escape Containment -->
  <g transform="translate(80, 680)">
    <rect width="1440" height="140" rx="12" fill="#15120e" stroke="#e8a317" stroke-width="1.2" />
    <text x="40" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#ffd56b">Critical Safety Constraint: Autonomous Containment &amp; Sandbox Escape Prevention</text>
    <text x="40" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#c7b99f">Because GPT-6 Cyber synthesizes real zero-day exploits, execution is strictly constrained inside air-gapped hardware enclaves.</text>
    <text x="40" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8e826b">Any attempt by the autonomous agent to probe host hypervisors or escape virtual boundaries triggers an immediate hard thermal shutdown.</text>
  </g>
</svg>
