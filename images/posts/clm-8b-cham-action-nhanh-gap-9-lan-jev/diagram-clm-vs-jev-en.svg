<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1c1914" />
      <stop offset="100%" stop-color="#0c0b09" />
    </radialGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#221e17" />
      <stop offset="100%" stop-color="#14120e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg-glow)" />

  <g stroke="#ffffff" stroke-width="1" opacity="0.03">
    <path d="M0 150 H1600 M0 300 H1600 M0 450 H1600 M0 600 H1600 M0 750 H1600" />
    <path d="M200 0 V900 M400 0 V900 M600 0 V900 M800 0 V900 M1000 0 V900 M1200 0 V900 M1400 0 V900" />
  </g>

  <!-- Header -->
  <text x="80" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#fae7b2" letter-spacing="1">System One Architecture: TypeSafe Jev vs. CLM-8B</text>
  <text x="80" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#8e826b">Comparing Sub-100ms Parallel Sampling with 11ms Dual-Encoder Contrastive Matching</text>

  <!-- Left Card: Jev -->
  <g transform="translate(80, 160)" filter="url(#shadow)">
    <rect width="680" height="660" rx="14" fill="url(#card-grad)" stroke="#d4af37" stroke-width="1.5" />
    
    <rect x="30" y="30" width="130" height="28" rx="6" fill="#e8a317" fill-opacity="0.15" />
    <text x="95" y="49" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#e8a317" text-anchor="middle">PARALLEL SAMPLER</text>

    <text x="30" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#fae7b2">TypeSafe AI · Jev</text>
    <text x="30" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#a39680">RLCD Trained Single-Pass Evaluator · Calibrated Structured Output</text>

    <!-- Stat Badges -->
    <rect x="30" y="150" width="180" height="65" rx="8" fill="#13110d" stroke="#2d271d" />
    <text x="45" y="176" font-family="ui-monospace, monospace" font-size="11" fill="#8e826b">LATENCY</text>
    <text x="45" y="202" font-family="ui-monospace, monospace" font-size="20" font-weight="700" fill="#e8a317">~100 ms</text>

    <rect x="230" y="150" width="180" height="65" rx="8" fill="#13110d" stroke="#2d271d" />
    <text x="245" y="176" font-family="ui-monospace, monospace" font-size="11" fill="#8e826b">PRICING</text>
    <text x="245" y="202" font-family="ui-monospace, monospace" font-size="20" font-weight="700" fill="#4ade80">$0.042 / 1M</text>

    <rect x="430" y="150" width="220" height="65" rx="8" fill="#13110d" stroke="#2d271d" />
    <text x="445" y="176" font-family="ui-monospace, monospace" font-size="11" fill="#8e826b">OUTPUT TYPE</text>
    <text x="445" y="202" font-family="ui-monospace, monospace" font-size="16" font-weight="600" fill="#22d3ee">Typed Values + Probs</text>

    <!-- Workflow Diagram Inside Card -->
    <rect x="30" y="240" width="620" height="240" rx="10" fill="#110f0c" stroke="#2d271d" />
    <text x="50" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#c7b99f">Internal Execution Pipeline:</text>

    <rect x="50" y="290" width="160" height="60" rx="6" fill="#1a1813" stroke="#3d3527" />
    <text x="130" y="318" font-family="ui-monospace, monospace" font-size="12" fill="#fff" text-anchor="middle">Input Context</text>
    <text x="130" y="336" font-family="ui-monospace, monospace" font-size="11" fill="#8e826b" text-anchor="middle">Prompt + Schema</text>

    <path d="M210 320 H250" stroke="#e8a317" stroke-width="2" />
    <polygon points="250,316 258,320 250,324" fill="#e8a317" />

    <rect x="260" y="290" width="200" height="60" rx="6" fill="#1a1813" stroke="#e8a317" />
    <text x="360" y="318" font-family="ui-monospace, monospace" font-size="12" fill="#ffd56b" text-anchor="middle">Parallel Sampler</text>
    <text x="360" y="336" font-family="ui-monospace, monospace" font-size="11" fill="#8e826b" text-anchor="middle">RLCD Probability Heads</text>

    <path d="M460 320 H500" stroke="#e8a317" stroke-width="2" />
    <polygon points="500,316 508,320 500,324" fill="#e8a317" />

    <rect x="510" y="290" width="140" height="60" rx="6" fill="#1a1813" stroke="#3d3527" />
    <text x="580" y="318" font-family="ui-monospace, monospace" font-size="12" fill="#4ade80" text-anchor="middle">Typed Decision</text>
    <text x="580" y="336" font-family="ui-monospace, monospace" font-size="11" fill="#8e826b" text-anchor="middle">Confidence Score</text>

    <rect x="50" y="375" width="580" height="85" rx="6" fill="#171511" />
    <text x="70" y="405" font-family="ui-monospace, monospace" font-size="12" fill="#22d3ee">Sample Return: { allow: true, confidence: 0.982, action: "route" }</text>
    <text x="70" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8e826b">Zero text generation pass. Directly consumable by backend logic without JSON parsing.</text>

    <!-- Features -->
    <text x="30" y="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#fae7b2">Key Strengths &amp; Limitations:</text>
    <text x="30" y="550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#4ade80">✔ Perfectly calibrated confidence intervals (95% stated = 95% empirical accuracy)</text>
    <text x="30" y="578" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#4ade80">✔ Native multi-turn conversational array handling</text>
    <text x="30" y="606" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#f43f5e">⚠ 100ms is still too high for 60Hz real-time robotics or UI click loops</text>
  </g>

  <!-- Right Card: CLM-8B -->
  <g transform="translate(840, 160)" filter="url(#shadow)">
    <rect width="680" height="660" rx="14" fill="url(#card-grad)" stroke="#22d3ee" stroke-width="1.5" />
    
    <rect x="30" y="30" width="160" height="28" rx="6" fill="#22d3ee" fill-opacity="0.15" />
    <text x="110" y="49" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#22d3ee" text-anchor="middle">DUAL-ENCODER CONTRAST</text>

    <text x="30" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#67e8f9">CLM-8B Engine</text>
    <text x="30" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#a39680">Two-Sided Caching · Latent Embedding Dot-Product Action Scorer</text>

    <!-- Stat Badges -->
    <rect x="30" y="150" width="180" height="65" rx="8" fill="#13110d" stroke="#2d271d" />
    <text x="45" y="176" font-family="ui-monospace, monospace" font-size="11" fill="#8e826b">LATENCY</text>
    <text x="45" y="202" font-family="ui-monospace, monospace" font-size="20" font-weight="700" fill="#22d3ee">~11 ms</text>

    <rect x="230" y="150" width="180" height="65" rx="8" fill="#13110d" stroke="#2d271d" />
    <text x="245" y="176" font-family="ui-monospace, monospace" font-size="11" fill="#8e826b">SPEEDUP</text>
    <text x="245" y="202" font-family="ui-monospace, monospace" font-size="20" font-weight="700" fill="#ffd56b">9x Faster vs Jev</text>

    <rect x="430" y="150" width="220" height="65" rx="8" fill="#13110d" stroke="#2d271d" />
    <text x="445" y="176" font-family="ui-monospace, monospace" font-size="11" fill="#8e826b">MATCHING LOGIC</text>
    <text x="445" y="202" font-family="ui-monospace, monospace" font-size="16" font-weight="600" fill="#4ade80">Vector Cosine Top-1</text>

    <!-- Workflow Diagram Inside Card -->
    <rect x="30" y="240" width="620" height="240" rx="10" fill="#110f0c" stroke="#2d271d" />
    <text x="50" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#c7b99f">Contrastive Action Scoring Pipeline:</text>

    <!-- Dual encoder tracks -->
    <rect x="50" y="285" width="200" height="42" rx="6" fill="#1a1813" stroke="#22d3ee" />
    <text x="150" y="311" font-family="ui-monospace, monospace" font-size="12" fill="#67e8f9" text-anchor="middle">State / Context Encoder</text>

    <rect x="50" y="335" width="200" height="42" rx="6" fill="#1a1813" stroke="#22d3ee" />
    <text x="150" y="361" font-family="ui-monospace, monospace" font-size="12" fill="#67e8f9" text-anchor="middle">Candidate Action Index</text>

    <path d="M260 306 H320" stroke="#22d3ee" stroke-width="2" />
    <path d="M260 356 H320" stroke="#22d3ee" stroke-width="2" />

    <rect x="330" y="285" width="160" height="92" rx="6" fill="#1a1813" stroke="#3d3527" />
    <text x="410" y="325" font-family="ui-monospace, monospace" font-size="12" fill="#ffd56b" text-anchor="middle">Matrix Dot Product</text>
    <text x="410" y="348" font-family="ui-monospace, monospace" font-size="11" fill="#8e826b" text-anchor="middle">cos(v_state, v_act)</text>

    <path d="M500 331 H535" stroke="#22d3ee" stroke-width="2" />
    <polygon points="535,327 543,331 535,335" fill="#22d3ee" />

    <rect x="545" y="285" width="95" height="92" rx="6" fill="#1a1813" stroke="#4ade80" />
    <text x="592" y="325" font-family="ui-monospace, monospace" font-size="11" fill="#4ade80" text-anchor="middle">Top-1 Score</text>
    <text x="592" y="348" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">11 ms</text>

    <rect x="50" y="390" width="580" height="75" rx="6" fill="#171511" />
    <text x="70" y="418" font-family="ui-monospace, monospace" font-size="12" fill="#ffd56b">Two-Sided Caching: Prefix KV + Precomputed Action Embeddings</text>
    <text x="70" y="443" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8e826b">Zero autoregressive generation pass; purely linear evaluation in dense embedding space.</text>

    <!-- Features -->
    <text x="30" y="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#67e8f9">Key Strengths &amp; Tradeoffs:</text>
    <text x="30" y="550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#4ade80">✔ 11ms latency enables true real-time autonomous agent loops (UI clicks, robotics)</text>
    <text x="30" y="578" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#4ade80">✔ Two-sided caching cuts edge memory throughput bottleneck</text>
    <text x="30" y="606" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#f43f5e">⚠ Requires predefined candidate action sets; less flexible for arbitrary open schemas</text>
  </g>
</svg>
