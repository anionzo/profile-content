<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1c160e" />
      <stop offset="45%" stop-color="#120e09" />
      <stop offset="85%" stop-color="#080604" />
      <stop offset="100%" stop-color="#040302" />
    </radialGradient>

    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="20%" stop-color="#fae7b2" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="ambient-gold" cx="45%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#e2ba4f" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#9a7220" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fae7b2" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8a651c" stop-opacity="0.2" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1600" height="900" fill="url(#bg)" />
  <rect width="1600" height="900" fill="url(#ambient-gold)" />

  <!-- Subtle Architecture Grid Lines -->
  <g stroke="#d4af37" stroke-width="0.8" opacity="0.04">
    <line x1="0" y1="180" x2="1600" y2="180" />
    <line x1="0" y1="360" x2="1600" y2="360" />
    <line x1="0" y1="540" x2="1600" y2="540" />
    <line x1="0" y1="720" x2="1600" y2="720" />
    <line x1="320" y1="0" x2="320" y2="900" />
    <line x1="640" y1="0" x2="640" y2="900" />
    <line x1="960" y1="0" x2="960" y2="900" />
    <line x1="1280" y1="0" x2="1280" y2="900" />
  </g>

  <!-- Binary Decision Logic Tree (System 1 Visualization) -->
  <g filter="url(#glow)">
    <!-- Root Line -->
    <line x1="240" y1="450" x2="480" y2="450" stroke="url(#line-grad)" stroke-width="3" />
    
    <!-- Level 1 Branches -->
    <path d="M 480 450 Q 560 450, 620 320 L 760 320" fill="none" stroke="url(#line-grad)" stroke-width="2.4" />
    <path d="M 480 450 Q 560 450, 620 580 L 760 580" fill="none" stroke="url(#line-grad)" stroke-width="2.4" />

    <!-- Level 2 Branches -->
    <path d="M 760 320 Q 820 320, 870 230 L 980 230" fill="none" stroke="url(#line-grad)" stroke-width="1.8" />
    <path d="M 760 320 Q 820 320, 870 410 L 980 410" fill="none" stroke="url(#line-grad)" stroke-width="1.8" />
    <path d="M 760 580 Q 820 580, 870 490 L 980 490" fill="none" stroke="url(#line-grad)" stroke-width="1.8" />
    <path d="M 760 580 Q 820 580, 870 670 L 980 670" fill="none" stroke="url(#line-grad)" stroke-width="1.8" />

    <!-- Level 3 Fine Branches -->
    <path d="M 980 230 Q 1030 230, 1070 170 L 1180 170" fill="none" stroke="url(#line-grad)" stroke-width="1.2" opacity="0.75" />
    <path d="M 980 230 Q 1030 230, 1070 290 L 1180 290" fill="none" stroke="url(#line-grad)" stroke-width="1.2" opacity="0.75" />
    <path d="M 980 410 Q 1030 410, 1070 350 L 1180 350" fill="none" stroke="url(#line-grad)" stroke-width="1.2" opacity="0.75" />
    <path d="M 980 410 Q 1030 410, 1070 470 L 1180 470" fill="none" stroke="url(#line-grad)" stroke-width="1.2" opacity="0.75" />
    <path d="M 980 490 Q 1030 490, 1070 430 L 1180 430" fill="none" stroke="url(#line-grad)" stroke-width="1.2" opacity="0.75" />
    <path d="M 980 490 Q 1030 490, 1070 550 L 1180 550" fill="none" stroke="url(#line-grad)" stroke-width="1.2" opacity="0.75" />
    <path d="M 980 670 Q 1030 670, 1070 610 L 1180 610" fill="none" stroke="url(#line-grad)" stroke-width="1.2" opacity="0.75" />
    <path d="M 980 670 Q 1030 670, 1070 730 L 1180 730" fill="none" stroke="url(#line-grad)" stroke-width="1.2" opacity="0.75" />
  </g>

  <!-- Glowing Core Origin Node -->
  <circle cx="240" cy="450" r="70" fill="url(#core-glow)" />
  <circle cx="240" cy="450" r="10" fill="#ffffff" />

  <!-- Decision Nodes -->
  <g fill="#fae7b2">
    <circle cx="480" cy="450" r="6" />
    <circle cx="760" cy="320" r="5" />
    <circle cx="760" cy="580" r="5" />
    <circle cx="980" cy="230" r="4.5" />
    <circle cx="980" cy="410" r="4.5" />
    <circle cx="980" cy="490" r="4.5" />
    <circle cx="980" cy="670" r="4.5" />
    <circle cx="1180" cy="170" r="3.5" opacity="0.85" />
    <circle cx="1180" cy="290" r="3.5" opacity="0.85" />
    <circle cx="1180" cy="350" r="3.5" opacity="0.85" />
    <circle cx="1180" cy="470" r="3.5" opacity="0.85" />
    <circle cx="1180" cy="430" r="3.5" opacity="0.85" />
    <circle cx="1180" cy="550" r="3.5" opacity="0.85" />
    <circle cx="1180" cy="610" r="3.5" opacity="0.85" />
    <circle cx="1180" cy="730" r="3.5" opacity="0.85" />
  </g>

  <!-- Typography Labels (Clean, Editorial, Non-intrusive) -->
  <g font-family="'Source Serif 4', Georgia, serif">
    <text x="240" y="360" font-size="52" font-weight="600" letter-spacing="3" fill="#fae7b2">JEV</text>
    <text x="240" y="395" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#a48035">TYPESAFE AI · SYSTEM ONE</text>
  </g>

  <g font-family="ui-monospace, 'Cascadia Code', monospace" font-size="13" letter-spacing="1.5" fill="#c49a3e" opacity="0.75">
    <text x="1200" y="174">{ approved: true, p: 0.98 }</text>
    <text x="1200" y="294">{ route: 'retry', p: 0.89 }</text>
    <text x="1200" y="354">{ allow: false, p: 0.95 }</text>
    <text x="1200" y="474">{ verified: true, p: 0.99 }</text>
    <text x="1200" y="614">{ rank: 1, p: 0.94 }</text>
    <text x="1200" y="734">{ flag: null, p: 0.97 }</text>
  </g>

  <!-- Minimal Decorative Frame -->
  <rect x="40" y="40" width="1520" height="820" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.12" />
  <circle cx="40" cy="40" r="3" fill="#d4af37" opacity="0.3" />
  <circle cx="1560" cy="40" r="3" fill="#d4af37" opacity="0.3" />
  <circle cx="40" cy="860" r="3" fill="#d4af37" opacity="0.3" />
  <circle cx="1560" cy="860" r="3" fill="#d4af37" opacity="0.3" />
</svg>
