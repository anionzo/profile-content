<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b14" />
      <stop offset="100%" stop-color="#0d0c0a" />
    </radialGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242019" />
      <stop offset="100%" stop-color="#161410" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8a317" />
      <stop offset="100%" stop-color="#ffd56b" />
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg-glow)" />

  <!-- Grid overlay -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.03">
    <path d="M0 150 H1600 M0 300 H1600 M0 450 H1600 M0 600 H1600 M0 750 H1600" />
    <path d="M200 0 V900 M400 0 V900 M600 0 V900 M800 0 V900 M1000 0 V900 M1200 0 V900 M1400 0 V900" />
  </g>

  <!-- Header -->
  <text x="80" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" fill="#fae7b2" letter-spacing="1">OpenRouter Routing Workflow: typesafe/jev-router</text>
  <text x="80" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#8e826b">Sub-100ms System One Traffic Controller · 1,000,000 Context Window · $0 Routing Fee</text>

  <!-- Flow Steps -->
  <!-- Step 1: Ingestion -->
  <g transform="translate(80, 160)" filter="url(#shadow)">
    <rect width="280" height="660" rx="14" fill="url(#card-grad)" stroke="#3d3527" stroke-width="1.5" />
    <rect x="24" y="24" width="70" height="26" rx="6" fill="#e8a317" fill-opacity="0.15" />
    <text x="59" y="42" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#e8a317" text-anchor="middle">STEP 01</text>
    
    <text x="24" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#fff">Client Request</text>
    <text x="24" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#a39680">Incoming API Payload</text>

    <!-- Details Box -->
    <rect x="20" y="145" width="240" height="200" rx="10" fill="#110f0c" stroke="#2d271d" />
    <text x="35" y="178" font-family="ui-monospace, monospace" font-size="13" fill="#e8a317">POST /chat/completions</text>
    <text x="35" y="210" font-family="ui-monospace, monospace" font-size="12" fill="#7d7260">model: "typesafe/jev-router"</text>
    <text x="35" y="235" font-family="ui-monospace, monospace" font-size="12" fill="#7d7260">messages: [ ... ]</text>
    <text x="35" y="260" font-family="ui-monospace, monospace" font-size="12" fill="#7d7260">tools: [ ... ]</text>
    <text x="35" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#22d3ee">Context: up to 1,000,000 toks</text>
    <text x="35" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#4ade80">Standard OpenAI Compatible</text>

    <text x="24" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#c7b99f">Ingestion Features:</text>
    <circle cx="32" cy="410" r="3" fill="#e8a317" />
    <text x="44" y="414" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#a39680">Zero manual switch-case code</text>
    <circle cx="32" cy="445" r="3" fill="#e8a317" />
    <text x="44" y="449" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#a39680">No brittle regex routing</text>
    <circle cx="32" cy="480" r="3" fill="#e8a317" />
    <text x="44" y="484" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#a39680">Full multi-turn array retained</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M375 490 H415" stroke="#e8a317" stroke-width="2.5" stroke-dasharray="4 4" />
  <polygon points="415,485 425,490 415,495" fill="#e8a317" />

  <!-- Step 2: Gateway & Jev Deliberation -->
  <g transform="translate(435, 160)" filter="url(#shadow)">
    <rect width="420" height="660" rx="14" fill="url(#card-grad)" stroke="#d4af37" stroke-width="2" />
    <rect x="24" y="24" width="70" height="26" rx="6" fill="#e8a317" fill-opacity="0.15" />
    <text x="59" y="42" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#e8a317" text-anchor="middle">STEP 02</text>
    <rect x="105" y="24" width="105" height="26" rx="6" fill="#22d3ee" fill-opacity="0.15" />
    <text x="157" y="42" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#22d3ee" text-anchor="middle">&lt; 100ms LATENCY</text>

    <text x="24" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#fae7b2">OpenRouter Edge + TypeSafe Jev</text>
    <text x="24" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#a39680">System One Direct Structured Classification</text>

    <!-- Sub Box A: Model Decision -->
    <rect x="20" y="145" width="380" height="220" rx="10" fill="#13110d" stroke="#3d3527" />
    <text x="36" y="176" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#ffd56b">Decision 1: Target Model Routing</text>
    <text x="36" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8e826b">Semantic intent &amp; tool complexity analysis</text>

    <rect x="36" y="215" width="348" height="38" rx="6" fill="#1a1813" stroke="#2d271d" />
    <text x="48" y="239" font-family="ui-monospace, monospace" font-size="12" fill="#4ade80">● Lightweight Task</text>
    <text x="220" y="239" font-family="ui-monospace, monospace" font-size="12" fill="#8e826b">→ Luna / Haiku</text>

    <rect x="36" y="260" width="348" height="38" rx="6" fill="#1a1813" stroke="#2d271d" />
    <text x="48" y="284" font-family="ui-monospace, monospace" font-size="12" fill="#22d3ee">● Standard Workload</text>
    <text x="220" y="284" font-family="ui-monospace, monospace" font-size="12" fill="#8e826b">→ Sol / Sonnet</text>

    <rect x="36" y="305" width="348" height="38" rx="6" fill="#1a1813" stroke="#2d271d" />
    <text x="48" y="329" font-family="ui-monospace, monospace" font-size="12" fill="#f43f5e">● Multi-step Reasoning</text>
    <text x="220" y="329" font-family="ui-monospace, monospace" font-size="12" fill="#8e826b">→ Opus / Astra / o1</text>

    <!-- Sub Box B: Reasoning Budget -->
    <rect x="20" y="380" width="380" height="180" rx="10" fill="#13110d" stroke="#3d3527" />
    <text x="36" y="411" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#ffd56b">Decision 2: Reasoning Budget Calibration</text>
    <text x="36" y="433" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8e826b">Dynamically allocates CoT thinking effort</text>

    <rect x="36" y="450" width="105" height="42" rx="6" fill="#1a1813" stroke="#2d271d" />
    <text x="88" y="476" font-family="ui-monospace, monospace" font-size="12" fill="#a39680" text-anchor="middle">effort: "none"</text>

    <rect x="157" y="450" width="105" height="42" rx="6" fill="#1a1813" stroke="#2d271d" />
    <text x="209" y="476" font-family="ui-monospace, monospace" font-size="12" fill="#e8a317" text-anchor="middle">effort: "medium"</text>

    <rect x="279" y="450" width="105" height="42" rx="6" fill="#1a1813" stroke="#2d271d" />
    <text x="331" y="476" font-family="ui-monospace, monospace" font-size="12" fill="#f43f5e" text-anchor="middle">effort: "high"</text>

    <text x="36" y="525" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#22d3ee">★ Non-generative: zero hallucination risk</text>
    <text x="36" y="546" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#8e826b">Returns calibrated probability tensor without text generation</text>

    <!-- Surcharge Info -->
    <rect x="20" y="575" width="380" height="60" rx="8" fill="#181510" stroke="#4ade80" stroke-width="1" />
    <text x="36" y="601" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#4ade80">Routing Token Surcharge: $0 / $0</text>
    <text x="36" y="622" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#a39680">OpenRouter charges zero markup on Jev decision tokens</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M870 490 H910" stroke="#e8a317" stroke-width="2.5" stroke-dasharray="4 4" />
  <polygon points="910,485 920,490 910,495" fill="#e8a317" />

  <!-- Step 3: Upstream Execution -->
  <g transform="translate(930, 160)" filter="url(#shadow)">
    <rect width="280" height="660" rx="14" fill="url(#card-grad)" stroke="#3d3527" stroke-width="1.5" />
    <rect x="24" y="24" width="70" height="26" rx="6" fill="#e8a317" fill-opacity="0.15" />
    <text x="59" y="42" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#e8a317" text-anchor="middle">STEP 03</text>

    <text x="24" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#fff">Target Execution</text>
    <text x="24" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#a39680">Upstream Model Call</text>

    <!-- Upstream targets -->
    <rect x="20" y="145" width="240" height="85" rx="8" fill="#110f0c" stroke="#2d271d" />
    <text x="35" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#ffd56b">Anthropic Tier</text>
    <text x="35" y="198" font-family="ui-monospace, monospace" font-size="12" fill="#8e826b">Claude Opus 5.5 / Sonnet</text>
    <text x="35" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#4ade80">Direct Provider Stream</text>

    <rect x="20" y="245" width="240" height="85" rx="8" fill="#110f0c" stroke="#2d271d" />
    <text x="35" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#ffd56b">OpenAI Frontier</text>
    <text x="35" y="298" font-family="ui-monospace, monospace" font-size="12" fill="#8e826b">GPT-6 Sol / Luna / Astra</text>
    <text x="35" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#4ade80">Direct Provider Stream</text>

    <rect x="20" y="345" width="240" height="85" rx="8" fill="#110f0c" stroke="#2d271d" />
    <text x="35" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#ffd56b">Open-Weight Host</text>
    <text x="35" y="398" font-family="ui-monospace, monospace" font-size="12" fill="#8e826b">DeepSeek / Llama 4</text>
    <text x="35" y="418" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#4ade80">Fast TTFT Endpoint</text>

    <text x="24" y="475" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#c7b99f">Billing Details:</text>
    <text x="24" y="505" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#a39680">User only pays actual tokens</text>
    <text x="24" y="525" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#a39680">consumed by target provider.</text>
    <text x="24" y="555" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#22d3ee">Savings: Up to 70% vs.</text>
    <text x="24" y="575" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#22d3ee">blanket frontier model calls.</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M1225 490 H1265" stroke="#e8a317" stroke-width="2.5" stroke-dasharray="4 4" />
  <polygon points="1265,485 1275,490 1265,495" fill="#e8a317" />

  <!-- Step 4: Stream Delivery -->
  <g transform="translate(1285, 160)" filter="url(#shadow)">
    <rect width="235" height="660" rx="14" fill="url(#card-grad)" stroke="#3d3527" stroke-width="1.5" />
    <rect x="24" y="24" width="70" height="26" rx="6" fill="#e8a317" fill-opacity="0.15" />
    <text x="59" y="42" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#e8a317" text-anchor="middle">STEP 04</text>

    <text x="24" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="700" fill="#fff">Response Stream</text>
    <text x="24" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#a39680">SSE Stream to Client</text>

    <!-- Terminal Output -->
    <rect x="20" y="145" width="195" height="260" rx="8" fill="#110f0c" stroke="#2d271d" />
    <text x="32" y="175" font-family="ui-monospace, monospace" font-size="11" fill="#4ade80">HTTP/1.1 200 OK</text>
    <text x="32" y="198" font-family="ui-monospace, monospace" font-size="11" fill="#8e826b">Content-Type:</text>
    <text x="32" y="216" font-family="ui-monospace, monospace" font-size="11" fill="#8e826b">text/event-stream</text>
    <text x="32" y="245" font-family="ui-monospace, monospace" font-size="11" fill="#ffd56b">data: {"choices":</text>
    <text x="32" y="265" font-family="ui-monospace, monospace" font-size="11" fill="#ffd56b">  [{"delta": ...}]}</text>
    <text x="32" y="295" font-family="ui-monospace, monospace" font-size="11" fill="#22d3ee">x-openrouter-model:</text>
    <text x="32" y="315" font-family="ui-monospace, monospace" font-size="11" fill="#22d3ee">"gpt-6-sol"</text>
    <text x="32" y="345" font-family="ui-monospace, monospace" font-size="11" fill="#8e826b">x-routing-ms: 78ms</text>
    <text x="32" y="375" font-family="ui-monospace, monospace" font-size="11" fill="#4ade80">[DONE]</text>

    <text x="24" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#c7b99f">Tradeoff Summary:</text>
    <text x="24" y="475" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#4ade80">✔ Significant cost drop</text>
    <text x="24" y="505" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#4ade80">✔ Auto CoT tuning</text>
    <text x="24" y="535" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#f43f5e">⚠ Adds 50-100ms TTFT</text>
    <text x="24" y="565" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" fill="#f43f5e">⚠ Unproven vs AutoRouter</text>
  </g>
</svg>
